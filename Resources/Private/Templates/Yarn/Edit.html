<!DOCTYPE html>
<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="main">
    <h2>
        <f:translate key="frontend.yarn.edit" />
    </h2>

    <f:form action="update" objectName="yarn" object="{yarn}">
        <f:render partial="Yarn/FormFields" arguments="{mainfibers: mainfibers, yarnWeights: yarnWeights}" />

        <button type="submit" class="btn btn-primary">
            <f:translate key="frontend.action.save" />
        </button>
        <f:link.action action="index" class="btn btn-link">
            <f:translate key="frontend.action.cancel" />
        </f:link.action>
    </f:form>
</f:section>

</html>
