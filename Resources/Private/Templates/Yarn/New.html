<!DOCTYPE html>
<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="main">
    <h2>Neues Garn anlegen</h2>

    <f:form action="create" objectName="yarn" object="{yarn}">
        <f:render partial="Yarn/FormFields" arguments="{mainfibers: mainfibers, yarnWeights: yarnWeights}" />

        <button type="submit" class="btn btn-primary">Speichern</button>
        <f:link.action action="index" class="btn btn-link">Abbrechen</f:link.action>
    </f:form>
</f:section>

</html>
